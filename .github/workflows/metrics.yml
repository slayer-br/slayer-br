name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: slayer-br
          filename: metrics.svg

          # FORÇA a saída para o Gist (impede commits no repositório)
          output_action: gist
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: 4c0179ac4ae471f63c5cbbbaf76e7875

          # Configurações de Repositórios e Forks
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes

          # Plugin de linguagens
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          
          # Aumenta o tempo limite de análise por repositório
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 15

          plugin_lines: yes
