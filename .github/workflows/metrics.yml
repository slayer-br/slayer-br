name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: slayer-br
          filename: metrics.svg

          # Envia a imagem gerada direto para o Gist
          output_action: gist
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: 4c0179ac4ae471f63c5cbbbaf76e7875

          # Escopo de busca de repositórios
          repositories_affiliations: owner, collaborator
          repositories_forks: yes

          # Configuração Global do Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_threshold: 0%

          # Desativa a estimativa por commits recentes para ler o total real em bytes
          plugin_languages_indepth: no
          plugin_languages_recent_load: 0

          plugin_lines: yes
