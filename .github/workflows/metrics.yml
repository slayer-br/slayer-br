name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: slayer-br
          filename: metrics.svg

          # FORÇA a saída para o Gist
          output_action: gist
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_gist: 4c0179ac4ae471f63c5cbbbaf76e7875

          # Configuração de Busca nos Repositórios
          repositories_affiliations: owner, collaborator
          repositories_forks: yes

          # Garante a busca detalhada em todos os repositórios do perfil
          base_indepth: yes

          # Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_threshold: 0%

          # Desativa o indepth do plugin para usar o cálculo direto de bytes da API do GitHub
          plugin_languages_indepth: no

          plugin_lines: yes
